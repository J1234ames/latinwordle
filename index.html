<!DOCTYPE HTML>
<html>
<style>
.container {
    display: flex;
    background-color: rgb(118, 186, 229);
}
.container div {
    background-color: rgb(200,200,200);
    margin: 10px;
    padding: 20px;
    font-size: 30px;
}
</style>
<title>Latin Wordle</title>
<body>

<div class = "container">
    <div id = "letter0"></div>
    <div id = "letter1"></div>
    <div id = "letter2"></div>
    <div id = "letter3"></div>
    <div id = "letter4"></div>
</div>

<script>
let word = "";
let allowed = new Set(["a","b","c","d"]);

addEventListener("keydown",updatetext) 
function updatetext() {  
  if (allowed.has(event.keyCode)) {
    word += event.key;
    for (let i = 0; i < 5; i++) {
      document.getElementById("letter" + i).innerHTML = word.at(i);
    };
  };
};
</script>

</body>
</html>
